<header class="border-b border-femto-border bg-femto-surface">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-4 gap-y-2 px-3 py-3 sm:px-4">
    <a href="{% url 'boards:home' %}" class="text-lg font-semibold tracking-tight text-femto-text">femtoboard</a>
    <nav class="flex flex-wrap gap-3 text-sm">
      {% for b in nav_boards %}
        <a class="text-femto-muted hover:text-femto-accent" href="{% url 'boards:board_index' board_code=b.code %}">[ /{{ b.code }}/ ]</a>
      {% endfor %}
    </nav>
    <div class="ml-auto flex items-center gap-3 text-sm">
      {% if user.is_authenticated %}
        <a class="text-femto-muted hover:text-femto-accent" href="{% url 'moderation:dashboard' %}">staff</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-femto-muted hover:text-femto-accent">log out</button>
        </form>
      {% else %}
        <a class="text-femto-muted hover:text-femto-accent" href="{% url 'accounts:login' %}">staff login</a>
      {% endif %}
    </div>
  </div>
</header>
